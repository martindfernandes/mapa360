<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapeamento 360 | Administração</title><link rel="stylesheet" href="./css/styles.css"><style>body{max-width:1180px;margin:auto;padding:24px}.admin{background:var(--panel,#fff);border:1px solid var(--line,#ddd);border-radius:16px;padding:22px;margin:18px 0}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.admin input{width:100%;padding:12px;border:1px solid #aab3c0;border-radius:8px}.admin table{width:100%;border-collapse:collapse}.admin td,.admin th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#64748b}.hidden{display:none}</style></head><body><header class="app-header"><div class="brand"><div><h1>Mapeamento <span class="word-360">360</span></h1><p>Gestão de avaliações</p></div></div><a href="./index.html">Abrir aplicativo</a></header><section class="admin" id="login"><h2>Acesso administrativo</h2><p class="muted">Acesse com suas credenciais administrativas.</p><label>Token administrativo<input id="adminToken" type="password" autocomplete="current-password"></label><p><button class="primary" id="enter">Acessar painel</button></p><p id="loginMsg" role="status"></p></section><main id="dashboard" class="hidden"><section class="admin"><h2>Novo convite</h2><div class="admin-grid"><label>Empresa<input id="company" placeholder="Razão social ou nome fantasia" required></label><label>Responsável<input id="contact" placeholder="Nome de quem responderá"></label><label>E-mail do contato<input id="email" type="email" placeholder="contato@empresa.com"></label><label>Validade (dias)<input id="days" type="number" min="1" max="90" value="30"></label></div><p><button class="primary" id="create">Gerar link de avaliação</button></p><div id="created" aria-live="polite"></div></section><section class="admin"><h2>Avaliações</h2><p class="muted">Acompanhe o andamento e consulte os resultados das avaliações.</p><div style="overflow:auto"><table><thead><tr><th>Empresa</th><th>Responsável</th><th>Status</th><th>Criado em</th><th>Última atividade</th><th>Resultado</th></tr></thead><tbody id="rows"><tr><td colspan="6">Carregue o painel.</td></tr></tbody></table></div><p><button id="refresh">Atualizar avaliações</button></p></section></main><script src="./js/admin.js" defer></script></body></html>
