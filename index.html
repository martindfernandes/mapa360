<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://challenges.cloudflare.com; media-src 'none'; object-src 'none'; frame-src https://challenges.cloudflare.com; worker-src 'none'; form-action 'none'; base-uri 'self'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Mapeamento 360 Autoavaliação — avaliação empresarial preenchida pela própria empresa.">
<title>Mapeamento 360 · Autoavaliação</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<header class="app-header">
  <div class="brand"><div class="logo" id="brandLogo" aria-hidden="true"></div><div><h1>Mapeamento <span class="word-360">360</span></h1><p>Diagnóstico. Planejamento. Evolução.</p></div></div>
  <nav class="main-tabs" role="tablist" aria-label="Seções do aplicativo">
    <button type="button" class="main-tab" role="tab" id="tab-assessment" aria-controls="panel-assessment" data-tab="assessment">Avaliação</button>
    <button type="button" class="main-tab" role="tab" id="tab-benchmarks" aria-controls="panel-benchmarks" data-tab="benchmarks">Referências e benchmarks</button>
    
    
  </nav>
  <div class="header-tools no-print">
    <button type="button" class="header-export" data-action="export-app-enc" title="Salvar uma cópia completa do aplicativo com os dados desta avaliação" aria-label="Salvar aplicativo completo com dados">⇩ <span>Salvar app + Dados</span></button>
    <span class="version-badge" id="versionBadge">Autoavaliação · v1.0.8</span>
  </div>
</header>
<main id="main" tabindex="-1">
  <section id="panel-assessment" data-panel="assessment" role="tabpanel" aria-labelledby="tab-assessment">
    <div class="assess-bar no-print">
      <div><div class="title" id="assessTitle">Nova avaliação</div><div class="fine" id="assessSub"></div></div>
      <div class="save-state" id="saveState" role="status" aria-live="polite"></div>
      <div class="btn-row">
        <button type="button" class="primary" data-action="save-assessment">Salvar rascunho</button>
        <button type="button" data-action="new-assessment">Reiniciar</button>
      </div>
    </div>
    <div id="resumeHost"></div>
    <nav class="steps no-print" aria-label="Etapas da avaliação" id="stepNav"></nav>
    <div class="panel" id="stepHost" tabindex="-1"></div>
    <div class="step-actions no-print">
      <button type="button" data-action="step-prev" id="btnPrev">Voltar</button>
      <button type="button" class="primary" data-action="step-next" id="btnNext">Próxima etapa</button><button type="button" class="primary" data-action="submit-evaluation" id="btnSubmit" hidden>Salvar e enviar avaliação</button>
    </div>
  </section>

  <section id="panel-benchmarks" data-panel="benchmarks" role="tabpanel" aria-labelledby="tab-benchmarks" hidden>
    <div class="panel" id="benchHost"></div>
  </section>

</main>
<footer id="appFooter"></footer>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toast" aria-live="polite" role="status"></div>

<script src="./js/app.js" defer></script>
</body>
</html>
